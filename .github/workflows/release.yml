name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish src/NextWatch.Desktop -c Release -r win-x64 --self-contained -p:PublishSingleFile=false -o publish
      - run: Compress-Archive -Path publish/* -DestinationPath NextWatch-win-x64.zip
      - uses: softprops/action-gh-release@v3
        with:
          files: NextWatch-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
